macro_addition:
  only_BLS_2017: true
  never_overwrite_existing: true
  full_unemployment_months: 37
  HPI_quarters: 13
  plus_prior_year_HPI: true
term_audit:
  elapsed_months: (event_date - first_disbursement).days / (365.25/12)
  valid_term: finite strictly positive reported months
  match_tolerance_months: 3
  strong_later_update_evidence: at least 100 date/term-valid charge-offs and >=50%
    with absolute difference <=3 months; coincidence is evidence, not proof
  verified_at_approval: requires supporting metadata or original vintage evidence;
    low matching share alone insufficient
lgd: unchanged v1/A2 1991-2002 primary; same per-loan capped and 1991,2000,2001 downturn
  proxies
scenario_paths: unchanged v1 baseline/adverse and 2006 reference; reference included
  in L2 estimation; not OOS validation
scope: G2-bis only; no new search/tuning, source refresh except missing BLS 2017,
  FRED, G3, G5, pushes or paid calls
pilot:
  bootstrap_first_attempts: 5
  included_in_199: true
  memory_limit_GiB: 6
  timing_bound_seconds: 1800
  if_timing_bound_hit: report incomplete pilot/fit, preserve attempts; no changed
    budget/specification without authorization
