version: protocol-v2-G2-bis-2026-10-08
seed: 20261008
outcome: recorded charge-off within 36 months
layers:
  layer1:
    training:
    - 1991
    - 2002
    calibration: 2003H2
    crisis:
    - 2007
    - 2009
    oot:
    - 2011
    - 2013
  layer2:
    training:
    - 1991
    - 2009
    tree_calibration:
    - 2010
    - 2010
    validation:
    - 2013
    - 2014
    validation_label: Retrospective conditional validation using realized macro paths.
reference_year: 2006
categorical_pooling:
  threshold: 0.001
  comparison: strictly below
  except:
  - ProjectState
  missing: __missing__ before training-frequency pooling
  unseen: Other if fitted Other exists; otherwise zero dummy vector with explicit
    unknown-support count; states never pooled
design:
  InitialInterestRate: excluded from all shared specifications
  rank_relative_tolerance: 1.0e-10
  handling: train-only numeric medians, missing flags and standardization; drop train-constant/exactly
    redundant columns without outcomes; preserve state effects
firth:
  max_iter: 100
  max_step: 5.0
  max_halvings: 25
  score_tolerance: 1.0e-05
  coefficient_tolerance: 1.0e-05
  likelihood_tolerance: 1.0e-05
  information_condition_limit: 100000000000000.0
  likelihood: sum w_i*(y_i eta_i-log(1+exp(eta_i)))
  penalty: 0.5 log det(X^T diag(w_i p_i (1-p_i)) X)
  point_start: intercept empirical-logit, all other coefficients zero
  draw_start: unit-weight point estimate
  threads: 4
unpenalized:
  max_iter: 500
  tolerance: 1.0e-08
  normalized_gradient_limit: 1.0e-05
  separation_coefficient_limit: 50
bootstrap:
  attempts: 199
  seed: 20261008
  weights: one Exp(1) per sorted state per attempt, shared across layers/specifications;
    normalized in each layer to loan count
  interval:
  - 0.025
  - 0.975
  quantile_method: linear
  failures: record attempt once, no redrawing; exclude failed/undefined values, report
    per-estimate denominators; require >=2 successful draws else interval unavailable
  frozen: all preprocessing, level maps, design columns, evaluation/reference loans,
    LGD and macro scenarios
evaluation:
  conditional_frozen_fit_state_cluster_draws: 999
  seed: 20261008
  calibration_deciles: unit-fit training score quantiles; never validation-based choice
  primary_firth: raw, diagnostic calibration only
